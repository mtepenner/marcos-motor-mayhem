name: Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Run Go tests
      working-directory: src/cmd/matchmaker
      run: go test -v -race ./...
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v3
      with:
        working-directory: src/cmd/matchmaker
    
    - name: Build binary
      working-directory: src/cmd/matchmaker
      run: go build -o ../../../build/matchmaker main.go
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: matchmaker-${{ runner.os }}
        path: build/matchmaker*

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production
      run: |
        echo "Deploying matchmaker service to production..."
        # Add deployment commands here
